# Weekly update PRs for the release workflow's actions and the Composer dev tooling.
# The plugin itself has no runtime dependencies.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      dev-tooling:
        patterns:
          - "*"

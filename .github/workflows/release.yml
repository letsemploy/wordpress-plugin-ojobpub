# Publishes a GitHub release with the installable plugin ZIP for every pushed tag.
# Tag format: v<version>, matching the version in ojobpub.php and readme.txt (e.g. v0.2.1).
# The release notes are the matching changelog entry from readme.txt.
# Plugin Check (the wordpress.org review tool) must pass before anything is published.
# Afterwards the same ZIP goes to trunk/ and tags/<version>/ of the wordpress.org SVN repository
# (requires the repository secret SVN_PASSWORD for the wordpress.org user letsemploy).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that tag and plugin version match
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version: *//p' ojobpub.php)
          constant=$(sed -n "s/^define( 'OJOBPUB_VERSION', '\(.*\)' );/\1/p" ojobpub.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the versions in ojobpub.php and readme.txt"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress

      - name: Download oJobPub schema
        run: curl -fsSL https://raw.githubusercontent.com/letsemploy/schema/main/v1/ojobpub.json -o "$RUNNER_TEMP/ojobpub.json"

      - name: Unit tests
        env:
          OJOBPUB_SCHEMA: ${{ runner.temp }}/ojobpub.json
        run: vendor/bin/phpunit

      - name: Coding standards
        run: vendor/bin/phpcs

      - name: Build ZIP
        run: make zip

      # Check exactly what gets released, with the same tool as the wordpress.org review.
      # Errors fail the job, so no release is published.
      - name: Unpack ZIP for Plugin Check
        run: unzip -q "dist/ojobpub-${{ steps.version.outputs.version }}.zip" -d dist/check

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/check/ojobpub
          slug: ojobpub

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/ojobpub-${{ steps.version.outputs.version }}.zip

      - name: Extract release notes from readme.txt
        run: |
          awk -v v="= ${{ steps.version.outputs.version }} =" '
            $0 == v { found = 1; next }
            found && /^= / { exit }
            found { print }
          ' readme.txt > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/ojobpub-${{ steps.version.outputs.version }}.zip" \
            --title "oJobPub ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

  # Separate job so it can be re-run on its own if the SVN commit fails.
  wordpress-org:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: wordpress-org-svn
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Subversion
        run: sudo apt-get update -q && sudo apt-get install -yq subversion

      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: dist

      - name: Unpack ZIP
        run: unzip -q "dist/ojobpub-${{ needs.build.outputs.version }}.zip" -d dist/build

      - name: Deploy to trunk and tags/${{ needs.build.outputs.version }}
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: bin/svn-deploy.sh dist/build/ojobpub "${{ needs.build.outputs.version }}"
